name: Native Windows diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Build embedded assets
        run: go run ./tools/build -output .scratch/sandboxed-agents.exe
      - name: Repeat native failure paths
        run: |
          go test -count=100 -timeout=10m -json -run '^(TestAgentLoginReportsDisabledBeforeMissingTerminal|TestVersionPrintsVersionAndAssetHash|TestSessionChangesWaitForAnInstallationToReleaseTheManagerLock|TestCurrentHostIdentifiesNativeWindowsHost)$' ./... | tee .scratch/focused-tests.jsonl
      - name: Preserve diagnostic results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-diagnostic-results
          path: .scratch/focused-tests.jsonl
          include-hidden-files: true
