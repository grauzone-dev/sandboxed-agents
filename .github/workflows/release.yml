name: Preview release

on:
  push:
    tags:
      - 'v*-preview.*'

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

env:
  GOPROXY: 'off'
  GOSUMDB: 'off'
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'
  RELEASE_TAG: ${{ github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ steps.check.outputs.preview }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - run: |
          mkdir -p .scratch
          go build -o .scratch/release-check ./tools/release
      - id: check
        run: |
          if .scratch/release-check -tag "$RELEASE_TAG" -check-tag; then
            echo 'preview=true' >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              exit "$status"
            fi
            echo 'preview=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tag
    if: needs.tag.outputs.preview == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            native: sandboxed-agents-linux-amd64
            test_timeout: 20m
            job_timeout: 30
          - os: windows-latest
            platform: windows
            native: sandboxed-agents-windows-amd64.exe
            test_timeout: 40m
            job_timeout: 50
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.job_timeout }}
    env:
      NATIVE_BINARY: ${{ matrix.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - run: go run ./tools/release -tag "$RELEASE_TAG" -output .scratch/preview
      - run: |
          ".scratch/preview/$NATIVE_BINARY" version > .scratch/version.txt
          asset_hash=$(sha256sum internal/assets/bundle.zip | cut -d ' ' -f 1)
          printf 'sandboxed-agents %s\nassets %s\n' "$RELEASE_TAG" "$asset_hash" > .scratch/expected-version.txt
          cmp .scratch/expected-version.txt .scratch/version.txt
          (cd .scratch/preview && sha256sum -c SHA256SUMS)
      - run: |
          go test -timeout "${{ matrix.test_timeout }}" -json ./... | tee .scratch/offline-tests.jsonl
          go vet ./...
      - name: Upload offline test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: offline-test-results-${{ matrix.platform }}
          path: .scratch/offline-tests.jsonl
          include-hidden-files: true
      - if: runner.os == 'Linux'
        run: bash tests/test-mirror-issue.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preview-${{ matrix.platform }}
          path: |
            .scratch/preview/*
            .scratch/version.txt
          if-no-files-found: error
          include-hidden-files: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: preview-*
          path: artifacts
      - run: |
          diff -r artifacts/preview-linux/preview artifacts/preview-windows/preview
          cmp artifacts/preview-linux/version.txt artifacts/preview-windows/version.txt
          (cd artifacts/preview-linux/preview && sha256sum -c SHA256SUMS)
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: artifacts/preview-linux/preview/*
      - env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for file in artifacts/preview-linux/preview/*; do
            gh attestation verify "$file" --repo "$GH_REPO" --bundle "$ATTESTATION_BUNDLE"
          done
      - run: |
          gh release create "$RELEASE_TAG" \
            artifacts/preview-linux/preview/* \
            --verify-tag --prerelease --title "$RELEASE_TAG" \
            --notes "Preview build of commit $GITHUB_SHA."
      - run: |
          gh release download "$RELEASE_TAG" --dir downloaded
          for file in downloaded/*; do
            gh attestation verify "$file" --repo "$GH_REPO"
            cp "$file" "$RUNNER_TEMP/tampered"
            printf '\n' >> "$RUNNER_TEMP/tampered"
            if gh attestation verify "$RUNNER_TEMP/tampered" --repo "$GH_REPO"; then
              exit 1
            fi
          done
