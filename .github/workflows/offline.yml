name: Offline suite

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            output: .scratch/sandboxed-agents
            artifact: linux
          - os: windows-latest
            output: .scratch/sandboxed-agents.exe
            artifact: windows
    runs-on: ${{ matrix.os }}
    env:
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      HOST_OUTPUT: ${{ matrix.output }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Build manager and host
        run: go run ./tools/build -output "$HOST_OUTPUT"
      - name: Test and vet
        run: |
          go test ./...
          go vet ./...
      - name: Test issue mirror
        if: runner.os == 'Linux'
        run: bash tests/test-mirror-issue.sh
      - name: Record embedded asset hash
        run: '"$HOST_OUTPUT" version > .scratch/version.txt'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: version-${{ matrix.artifact }}
          path: .scratch/version.txt

  compare-assets:
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: version-*
          path: versions
      - name: Compare Linux and Windows embedded assets
        run: cmp versions/version-linux/version.txt versions/version-windows/version.txt
