# Temporary #55 diagnosis loop (DEBUG-55): the full Windows offline suite command of offline.yml with one
# cut, -run selecting the original readiness protocol test (observed through DEBUG_55_ORIGINAL_OBSERVE) and
# the top-level tests of other packages that were running during its failing valid case in the red full
# runs 38079043304 and 38079043223. Every package is still built and its test binary started. The file
# keeps its earlier name so that the temporary files stay the same set. Before the branch ships, remove this workflow and
# internal/sandbox/readiness_ci_debug_test.go, and restore internal/sandbox/readiness_protocol_test.go.
name: Issue 55 readiness active-load loop

on:
  push:
    branches:
      - feature/55-live-update-rollback
    paths:
      - .github/workflows/issue-55-readiness-fast-loop.yml
      - internal/sandbox/readiness_ci_debug_test.go
      - internal/sandbox/readiness_protocol_test.go

permissions:
  contents: read

jobs:
  full:
    name: 55-active-load-loop (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      HOST_OUTPUT: .scratch/sandboxed-agents.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
      - name: Build manager and host
        run: go run ./tools/build -output "$HOST_OUTPUT"
      - name: SSH client on PATH, without starting it
        run: |
          command -v ssh
          type -a ssh
      - name: Test and vet
        env:
          DEBUG_55_ORIGINAL_OBSERVE: ${{ runner.temp }}\issue-55-original-observe.txt
        run: |
          go test -timeout "40m" -json -run '^(TestSandboxReadinessRequiresAVerifiedKeyExchangeFromTheRealSSHClient|TestAgentLoginReportsTheEarliestFailureAndStartsNoWorkflow|TestInstalledCommandForwardsArgumentsStreamsAndStatus|TestCurrentHostIdentifiesNativeWindowsHost|TestRunReturnsExternalStatusAndStreams|TestPublicKeyCanonicalizesOneEd25519SSHKey|TestPublicKeyRequiresExactlyOneCompleteEd25519WireEncoding|TestPublicKeyRejectsControlCharacters|TestFakeProgramsReturnScriptedOutputAndRecordExactArguments|TestFakeProgramsRepeatAProbeUntilTheNextOperation|TestFakeProgramsRepeatedProbesLeaveScriptedResponsesUntouched)$' ./... | tee .scratch/offline-tests.jsonl
          go vet ./...
      - name: SSH client version, after the suite
        if: always()
        run: ssh -V
      - name: Upload test JSON and observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-55-active-load-loop-windows
          path: |
            .scratch/offline-tests.jsonl
            ${{ runner.temp }}/issue-55-original-observe.txt
          include-hidden-files: true
      - name: Verdict
        if: always()
        run: |
          grep -h -E '"Test":"TestSandboxReadinessRequiresAVerifiedKeyExchangeFromTheRealSSHClient/[^"]*","Elapsed"' .scratch/offline-tests.jsonl || true
          grep -h -E 'DEBUG-55-ORIGINAL .* (mode=|ready=|wait-result=|attempt=[0-9]+ start-ms=)' "$RUNNER_TEMP/issue-55-original-observe.txt" || echo "no observation file"
